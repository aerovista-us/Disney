name: Build Jordan social assets and wire site v3

on:
  push:
    paths:
      - 'site-v3-trigger.txt'

permissions:
  contents: write

jobs:
  build-and-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render share and icon PNGs
        run: |
          rsvg-convert -w 1200 -h 630 social-preview.svg -o social-preview.png
          rsvg-convert -w 180 -h 180 favicon.svg -o apple-touch-icon.png
          rsvg-convert -w 32 -h 32 favicon.svg -o favicon-32.png

      - name: Wire metadata and v3 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'favicon.svg' not in s:
              inject='''\n  <link rel="icon" href="favicon.svg" type="image/svg+xml" />\n  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />\n  <link rel="apple-touch-icon" href="apple-touch-icon.png" />\n  <meta property="og:url" content="https://aerovista-us.github.io/Disney/" />\n  <meta property="og:image" content="https://aerovista-us.github.io/Disney/social-preview.png" />\n  <meta property="og:image:width" content="1200" />\n  <meta property="og:image:height" content="630" />\n  <meta property="og:image:alt" content="Jordan worldwide Disney vacation planning — Disney trips, beautifully planned." />\n  <meta name="twitter:card" content="summary_large_image" />\n  <meta name="twitter:title" content="Jordan | Disney Trips, Designed Around You" />\n  <meta name="twitter:description" content="Build the wish, compare real trip inputs, and book with Jordan for a smoother Disney vacation." />\n  <meta name="twitter:image" content="https://aerovista-us.github.io/Disney/social-preview.png" />'''
              s=s.replace('  <link rel="stylesheet" href="styles.css" />',inject+'\n  <link rel="stylesheet" href="styles.css" />')
          if 'site-v3.css' not in s:
              s=s.replace('  <link rel="stylesheet" href="styles.css" />','  <link rel="stylesheet" href="styles.css" />\n  <link rel="stylesheet" href="site-v3.css" />')
          if 'site-v3.js' not in s:
              s=s.replace('  <script defer src="app.js"></script>','  <script defer src="app.js"></script>\n  <script defer src="site-v3.js"></script>\n  <script defer src="signed-v3-late.js"></script>')
          p.write_text(s)
          PY

      - name: Commit generated assets and metadata
        run: |
          git config user.name "AeroVista Automation"
          git config user.email "aerovistaus@gmail.com"
          git add index.html social-preview.png apple-touch-icon.png favicon-32.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Wire Book with Jordan branding and social assets"
            git push
          fi
