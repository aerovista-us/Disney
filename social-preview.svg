    <path d="M1085 190 1089 200l10 4-10 4-4 10-4-10-10-4 10-4 4-10Z"/>
    <path d="M842 126 846 136l10 4-10 4-4 10-4-10-10-4 10-4 4-10Z"/>
  </g>

  <g transform="translate(70 566)">
    <rect width="470" height="42" rx="21" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="22" y="28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Jordan approved · Signed with a J ✦</text>
  </g>
